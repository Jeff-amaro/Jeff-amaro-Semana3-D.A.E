<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quiz Lab{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem auto; max-width: 800px; color: #222; }
        header { border-bottom: 2px solid #333; margin-bottom: 1.5rem; padding-bottom: .5rem; }
        nav a { margin-right: 1rem; }
        .choice { list-style: none; padding: 0; }
        .choice li { padding: .25rem 0; }
        .correct { color: #1a7f37; font-weight: bold; }
        form p { margin: .5rem 0; }
        .errorlist { color: #b02a2a; }
    </style>
</head>
<body>
    <header>
        <h1>Quiz Laboratory</h1>
        <nav>
            <a href="{% url 'quiz:exam_list' %}">Exams</a>
            <a href="{% url 'quiz:question_create' %}">Add question</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
